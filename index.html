<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>STANDOFF MARKET</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 20% 0%, #24204a 0%, transparent 35%),
        radial-gradient(circle at 100% 30%, #35144f 0%, transparent 35%),
        #090911;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

button {
    font-family: Arial, sans-serif;
    cursor: pointer;
}

.app {
    max-width: 520px;
    margin: auto;
    padding: 18px 16px 35px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg,#7b4dff,#b84dff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.logo-title {
    font-size: 17px;
    font-weight: 800;
}

.logo-subtitle {
    font-size: 11px;
    color: #8d8d9d;
    margin-top: 3px;
}

.balance {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.08);
    padding: 10px 13px;
    border-radius: 14px;
    font-weight: 700;
}

.welcome {
    background: linear-gradient(
        135deg,
        rgba(116,72,255,.30),
        rgba(184,67,255,.12)
    );
    border: 1px solid rgba(160,100,255,.25);
    border-radius: 24px;
    padding: 22px;
    margin-bottom: 18px;
}

.welcome h1 {
    margin: 0 0 8px;
    font-size: 26px;
}

.welcome p {
    margin: 0;
    color: #b8b8c7;
    line-height: 1.45;
    font-size: 14px;
}

.nav {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.nav button {
    border: 0;
    color: white;
    background: rgba(255,255,255,.075);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 17px;
    padding: 17px 10px;
    font-size: 14px;
    font-weight: 700;
}

.nav .roulette {
    background: linear-gradient(135deg,#713dff,#a13fff);
}

.section-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
}

.section-title h2 {
    margin: 0;
    font-size: 19px;
}

.skins {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 11px;
}

.skin {
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 18px;
    padding: 12px;
}

.skin-image {
    height: 105px;
    border-radius: 14px;
    background:
        radial-gradient(circle,rgba(145,75,255,.35),transparent 55%),
        #11111c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 43px;
    margin-bottom: 10px;
}

.skin-name {
    font-size: 14px;
    font-weight: 700;
}

.skin-type {
    color: #8d8d9b;
    font-size: 11px;
    margin-top: 4px;
}

.skin-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
}

.price {
    font-size: 14px;
    font-weight: 800;
}

.buy {
    border: 0;
    border-radius: 10px;
    padding: 8px 11px;
    background: #7b4dff;
    color: white;
    font-weight: 700;
}

.roulette-box {
    display: none;
    margin-top: 20px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 23px;
    padding: 18px;
    overflow: hidden;
}

.roulette-box.active {
    display: block;
}

.roulette-title {
    text-align: center;
    font-size: 20px;
    font-weight: 800;
}

.roulette-subtitle {
    text-align: center;
    color: #8f8f9d;
    font-size: 12px;
    margin: 6px 0 18px;
}

.roulette-window {
    position: relative;
    overflow: hidden;
    border-radius: 17px;
    border: 1px solid rgba(255,255,255,.1);
    background: #0d0d16;
}

.roulette-pointer {
    position: absolute;
    z-index: 5;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    background: #a66bff;
    box-shadow: 0 0 15px #9c58ff;
    transform: translateX(-50%);
}

.roulette-track {
    display: flex;
    gap: 8px;
    padding: 10px;
    transform: translateX(0);
    will-change: transform;
}

.roulette-item {
    flex: 0 0 100px;
    height: 100px;
    border-radius: 14px;
    background: #171722;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
}

.roulette-item span {
    font-size: 35px;
    margin-bottom: 5px;
}

.spin {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: 0;
    border-radius: 15px;
    background: linear-gradient(135deg,#7547ff,#b044ff);
    color: white;
    font-size: 15px;
    font-weight: 800;
}

.spin:disabled {
    opacity: .5;
}

.result {
    text-align: center;
    margin-top: 14px;
    color: #c7a7ff;
    font-weight: 700;
    min-height: 25px;
}

.footer {
    text-align: center;
    color: #555563;
    font-size: 11px;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="logo">

<div class="logo-icon">🎮</div>

<div>
<div class="logo-title">STANDOFF MARKET</div>
<div class="logo-subtitle">MARKET • SKINS • ROULETTE</div>
</div>

</div>

<div class="balance" id="balance">
🪙 ...
</div>

</header>


<section class="welcome">

<h1>Добро пожаловать 👋</h1>

<p>
Покупай скины, участвуй в рулетках
и собирай свою коллекцию.
</p>

</section>


<nav class="nav">

<button onclick="showMarket()">🛒 Магазин</button>

<button class="roulette" onclick="showRoulette()">
🎰 Рулетка
</button>

<button onclick="showProfile()">👤 Профиль</button>

<button onclick="showPurchases()">📦 Покупки</button>

</nav>


<section id="market">

<div class="section-title">

<h2>🔥 Популярные скины</h2>

</div>

<div id="skins" class="skins"></div>

</section>


<section id="roulette" class="roulette-box">

<div class="roulette-title">
🎰 STANDOFF ROULETTE
</div>

<div class="roulette-subtitle">
Стоимость вращения — 30 🪙
</div>

<div class="roulette-window">

<div class="roulette-pointer"></div>

<div id="rouletteTrack" class="roulette-track"></div>

</div>

<button
id="spinButton"
class="spin"
onclick="spinRoulette()"
>
🎰 КРУТИТЬ — 30 🪙
</button>

<div id="result" class="result"></div>

</section>


<div class="footer">
STANDOFF MARKET © 2026
</div>

</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =========================================
   API
========================================= */

const API_URL =
    "https://standoff-market-api.onrender.com";


let userData = null;
let spinning = false;


/* =========================================
   API ЗАПРОС
========================================= */

async function apiRequest(
    path,
    options = {}
) {

    const headers = {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data":
            tg.initData
    };

    const response =
        await fetch(
            API_URL + path,
            {
                ...options,
                headers
            }
        );

    const data =
        await response.json();

    if (!response.ok) {
        throw new Error(
            data.error ||
            "Ошибка сервера"
        );
    }

    return data;
}


/* =========================================
   ЗАГРУЗКА ПОЛЬЗОВАТЕЛЯ
========================================= */

async function loadUser() {

    try {

        const data =
            await apiRequest(
                "/api/me"
            );

        userData = data;

        updateBalance(
            data.balance
        );

        renderSkins(
            data.skins
        );

    } catch (error) {

        console.error(error);

        tg.showAlert(
            "❌ Не удалось подключиться к серверу.\n\n" +
            error.message
        );

    }

}


/* =========================================
   БАЛАНС
========================================= */

function updateBalance(
    value
) {

    document
        .getElementById("balance")
        .innerText =
        "🪙 " + value;

}


/* =========================================
   МАГАЗИН
========================================= */

function renderSkins(
    skins
) {

    const container =
        document.getElementById(
            "skins"
        );

    container.innerHTML = "";

    skins.forEach(
        skin => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "skin";

            element.innerHTML = `

                <div class="skin-image">
                    ${skin.icon}
                </div>

                <div class="skin-name">
                    ${skin.name}
                </div>

                <div class="skin-type">
                    ${skin.type}
                </div>

                <div class="skin-bottom">

                    <div class="price">
                        🪙 ${skin.price}
                    </div>

                    <button
                        class="buy"
                        onclick="buySkin('${escapeText(skin.name)}')"
                    >
                        Купить
                    </button>

                </div>
            `;

            container.appendChild(
                element
            );

        }
    );

}


/* =========================================
   ПОКУПКА
========================================= */

async function buySkin(
    skinName
) {

    try {

        const data =
            await apiRequest(
                "/api/buy",
                {
                    method: "POST",

                    body: JSON.stringify({
                        skin: skinName
                    })
                }
            );

        updateBalance(
            data.balance
        );

        tg.showAlert(
            "✅ Покупка успешна!\n\n" +
            data.skin.icon +
            " " +
            data.skin.name
        );

    } catch (error) {

        tg.showAlert(
            "❌ " +
            error.message
        );

    }

}


/* =========================================
   РУЛЕТКА
========================================= */

function showRoulette() {

    const roulette =
        document.getElementById(
            "roulette"
        );

    roulette.classList.add(
        "active"
    );

    roulette.scrollIntoView({
        behavior: "smooth"
    });

}


function createRoulette(
    skins
) {

    const track =
        document.getElementById(
            "rouletteTrack"
        );

    track.innerHTML = "";

    for (
        let i = 0;
        i < 60;
        i++
    ) {

        const skin =
            skins[
                i % skins.length
            ];

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "roulette-item";

        item.innerHTML =
            `
            <span>${skin.icon}</span>
            ${skin.name}
            `;

        track.appendChild(
            item
        );

    }

}


/* =========================================
   SPIN
========================================= */

async function spinRoulette() {

    if (spinning) {
        return;
    }

    spinning = true;

    const button =
        document.getElementById(
            "spinButton"
        );

    const result =
        document.getElementById(
            "result"
        );

    button.disabled = true;

    result.innerText =
        "🎰 Рулетка крутится...";


    try {

        const data =
            await apiRequest(
                "/api/spin",
                {
                    method: "POST"
                }
            );


        updateBalance(
            data.balance
        );


        const items =
            document.querySelectorAll(
                ".roulette-item"
            );


        const winningName =
            data.skin.name;


        let targetIndex = -1;


        for (
            let i = items.length - 1;
            i >= 0;
            i--
        ) {

            if (
                items[i].innerText
                    .trim()
                    .includes(
                        winningName
                    )
            ) {

                targetIndex = i;

                break;

            }

        }


        if (
            targetIndex === -1
        ) {

            throw new Error(
                "Скин не найден в рулетке"
            );

        }


        const windowElement =
            document.querySelector(
                ".roulette-window"
            );


        const itemWidth = 108;

        const center =
            windowElement.offsetWidth /
            2;


        const targetCenter =
            targetIndex *
            itemWidth +
            50;


        const finalPosition =
            center -
            targetCenter;


        const track =
            document.getElementById(
                "rouletteTrack"
            );


        track.style.transition =
            "transform 4.5s cubic-bezier(.12,.75,.18,1)";


        track.style.transform =
            "translateX(" +
            finalPosition +
            "px)";


        setTimeout(
            () => {

                result.innerHTML =
                    "🎉 Ты выиграл:<br>" +
                    data.skin.icon +
                    " <b>" +
                    data.skin.name +
                    "</b>";

                spinning = false;

                button.disabled =
                    false;

                if (
                    tg.HapticFeedback
                ) {

                    tg.HapticFeedback
                        .notificationOccurred(
                            "success"
                        );

                }

            },
            4700
        );


    } catch (error) {

        result.innerText = "";

        button.disabled =
            false;

        spinning = false;

        tg.showAlert(
            "❌ " +
            error.message
        );

    }

}


/* =========================================
   ПРОФИЛЬ
========================================= */

function showProfile() {

    if (!userData) {
        return;
    }

    tg.showAlert(
        "👤 Профиль\n\n" +
        "🆔 ID: " +
        userData.user.id +
        "\n\n" +
        "👤 " +
        userData.user.name +
        "\n\n" +
        "🪙 Баланс: " +
        userData.balance
    );

}


/* =========================================
   ПОКУПКИ
========================================= */

function showPurchases() {

    if (!userData) {
        return;
    }

    if (
        !userData.purchases ||
        userData.purchases.length === 0
    ) {

        tg.showAlert(
            "📦 Покупки\n\n" +
            "Покупок пока нет."
        );

        return;

    }


    let text =
        "📦 МОИ ПОКУПКИ\n\n";


    userData.purchases.forEach(
        item => {

            text +=
                "🎨 " +
                item.name +
                " — " +
                item.price +
                " 🪙\n";

        }
    );


    tg.showAlert(
        text
    );

}


/* =========================================
   МАГАЗИН
========================================= */

function showMarket() {

    document
        .getElementById(
            "market"
        )
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* =========================================
   ЭКРАНИРОВАНИЕ
========================================= */

function escapeText(
    text
) {

    return text
        .replace(
            /'/g,
            "\\'"
        );

}


/* =========================================
   ЗАПУСК
========================================= */

async function start() {

    await loadUser();

    if (
        userData &&
        userData.skins
    ) {

        createRoulette(
            userData.skins
        );

    }

}


start();

</script>

</body>
</html>
