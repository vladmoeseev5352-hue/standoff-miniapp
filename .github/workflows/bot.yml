name: Run Telegram Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find bot.py
        run: |
          echo "Current directory:"
          pwd

          echo "Files in repository:"
          ls -la

          echo "Searching for bot.py:"
          find . -type f -name "bot.py"

      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          BOT_FILE=$(find . -type f -name "bot.py" -print -quit)

          if [ -z "$BOT_FILE" ]; then
            echo "ERROR: bot.py not found!"
            exit 1
          fi

          echo "Found bot: $BOT_FILE"
          echo "Starting bot..."
          python "$BOT_FILE"
