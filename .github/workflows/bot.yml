name: Run Telegram Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check bot.py
        run: |
          echo "WORKSPACE:"
          echo "$GITHUB_WORKSPACE"

          echo "CURRENT DIRECTORY:"
          pwd

          echo "FILES:"
          ls -la

          echo "CHECK BOT:"
          ls -la "$GITHUB_WORKSPACE/bot.py"

      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "Starting bot from:"
          pwd
          echo "Running:"
          ls -la bot.py
          python -u bot.py
